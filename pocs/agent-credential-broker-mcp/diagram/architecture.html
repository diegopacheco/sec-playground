<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fffdf8; }
  svg { display: block; font-family: "Caveat", cursive; }
  .t { font-size: 30px; font-weight: 700; fill: #1d1d1f; }
  .s { font-size: 23px; fill: #3b3b40; }
  .n { font-size: 22px; font-weight: 700; fill: #fff; }
  .edge { font-size: 22px; fill: #3b3b40; }
</style>
</head>
<body>
<svg id="d" width="1480" height="800" viewBox="0 0 1480 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b30"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="40" y="52" class="t" style="font-size:40px">agent-credential-broker-mcp</text>
  <text x="40" y="84" class="s">the agent never holds the key: it asks, a human approves, the broker makes the call</text>

  <g filter="url(#wobble)" stroke="#2b2b30" stroke-width="2.5" stroke-linejoin="round">
    <rect x="40" y="170" width="230" height="130" rx="18" fill="#e9e2fb"/>
    <rect x="340" y="170" width="250" height="130" rx="18" fill="#dcebfb"/>
    <rect x="670" y="130" width="400" height="420" rx="22" fill="#d9f2e6"/>
    <rect x="1150" y="120" width="290" height="140" rx="18" fill="#efe1fa"/>
    <rect x="1150" y="330" width="290" height="140" rx="18" fill="#fdf2c9"/>
    <rect x="1150" y="600" width="290" height="130" rx="18" fill="#fbdcdc" stroke="#c0392b" stroke-dasharray="10 7"/>
    <rect x="340" y="560" width="250" height="140" rx="18" fill="#fde5cc"/>
    <rect x="700" y="215" width="340" height="310" rx="14" fill="#f5fbf8"/>
  </g>

  <text x="62" y="215" class="t">AI agent</text>
  <text x="62" y="250" class="s">Claude Code</text>
  <text x="62" y="280" class="s">no credentials</text>

  <text x="362" y="215" class="t">cmd/mcp</text>
  <text x="362" y="250" class="s">stdio MCP bridge</text>
  <text x="362" y="280" class="s">4 tools, holds nothing</text>

  <text x="692" y="178" class="t">broker daemon</text>
  <text x="692" y="205" class="s">127.0.0.1 only</text>
  <text x="720" y="258" class="s">1. policy: host, method, path</text>
  <text x="720" y="302" class="s">2. intent waits for approval</text>
  <text x="720" y="346" class="s">3. HMAC token, single use,</text>
  <text x="746" y="376" class="s">bound to method+URL+body</text>
  <text x="720" y="420" class="s">4. fetch key, inject header</text>
  <text x="720" y="464" class="s">5. no redirects, redact reply</text>
  <text x="720" y="508" class="s">6. hash chained audit log</text>

  <text x="1172" y="165" class="t">Vault / Keychain</text>
  <text x="1172" y="200" class="s">KV v2 or security cli</text>
  <text x="1172" y="232" class="s">read only at call time</text>

  <text x="1172" y="375" class="t">vendor API</text>
  <text x="1172" y="410" class="s">allowlisted host only</text>
  <text x="1172" y="442" class="s">Authorization: Bearer ****</text>

  <text x="1172" y="645" class="t" style="fill:#a52a1f">collector.invalid</text>
  <text x="1172" y="680" class="s">other hosts, redirects,</text>
  <text x="1172" y="710" class="s">path escapes: refused</text>

  <text x="362" y="605" class="t">human + UI</text>
  <text x="362" y="640" class="s">approve the exact request</text>
  <text x="362" y="672" class="s">admin token, not the agent</text>

  <g filter="url(#wobble)" stroke="#2b2b30" stroke-width="2.5" fill="none">
    <path d="M272 235 L336 235" marker-end="url(#arrow)"/>
    <path d="M592 235 L666 235" marker-end="url(#arrow)"/>
    <path d="M1072 190 L1146 190" marker-end="url(#arrow)"/>
    <path d="M1072 400 L1146 400" marker-end="url(#arrow)"/>
    <path d="M592 630 C 640 630, 690 610, 760 552" marker-end="url(#arrow)"/>
    <path d="M1072 520 C 1110 560, 1120 610, 1146 650" stroke="#c0392b" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
  </g>

  <text x="276" y="222" class="edge">stdio</text>
  <text x="598" y="222" class="edge">/agent/*</text>
  <text x="1080" y="178" class="edge">fetch</text>
  <text x="1080" y="388" class="edge">call</text>
  <text x="650" y="668" class="edge">/api approve</text>
  <path d="M1098 588 l16 16 m0 -16 l-16 16" stroke="#c0392b" stroke-width="4" filter="url(#wobble)"/>

  <g filter="url(#wobble)">
    <circle cx="304" cy="268" r="15" fill="#6d28d9"/>
    <circle cx="630" cy="268" r="15" fill="#0f766e"/>
    <circle cx="600" cy="680" r="15" fill="#b45309"/>
    <circle cx="1110" cy="222" r="15" fill="#0f766e"/>
    <circle cx="1110" cy="432" r="15" fill="#0f766e"/>
  </g>
  <text x="297" y="275" class="n">1</text>
  <text x="623" y="275" class="n">2</text>
  <text x="593" y="687" class="n">3</text>
  <text x="1103" y="229" class="n">4</text>
  <text x="1103" y="439" class="n">5</text>
</svg>
</body>
</html>
