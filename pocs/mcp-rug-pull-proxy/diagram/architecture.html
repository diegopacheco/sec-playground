<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCP Rug Pull Proxy architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fdfcf8; }
  svg { display: block; font-family: "Caveat", "Comic Sans MS", cursive; }
  .title { font-size: 40px; font-weight: 700; fill: #1d1d1f; }
  .h { font-size: 28px; font-weight: 700; fill: #1d1d1f; }
  .t { font-size: 21px; fill: #3a3a3f; }
  .l { font-size: 20px; fill: #5b21b6; }
  .step { font-size: 23px; fill: #1d1d1f; }
  .shape { stroke: #1d1d1f; stroke-width: 2.2; }
  .line { stroke: #1d1d1f; stroke-width: 2.2; fill: none; }
</style>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1d1d1f" stroke-width="2"/>
    </marker>
  </defs>

  <text x="600" y="62" text-anchor="middle" class="title">MCP Rug Pull Proxy: how a tool reaches the model</text>

  <g filter="url(#wobble)">
    <rect x="30" y="150" width="240" height="110" rx="14" fill="#dbeafe" class="shape"/>
    <rect x="450" y="130" width="300" height="150" rx="14" fill="#ede9fe" class="shape"/>
    <rect x="930" y="150" width="240" height="110" rx="14" fill="#dcfce7" class="shape"/>
    <rect x="430" y="420" width="340" height="150" rx="14" fill="#fef9c3" class="shape"/>
    <rect x="30" y="405" width="260" height="80" rx="14" fill="#fce7f3" class="shape"/>
    <rect x="30" y="515" width="260" height="80" rx="14" fill="#fce7f3" class="shape"/>
    <rect x="920" y="420" width="250" height="150" rx="14" fill="#ffedd5" class="shape"/>
    <rect x="30" y="650" width="1140" height="120" rx="14" fill="#f5f5f4" class="shape"/>

    <path d="M272 205 L448 205" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M752 205 L928 205" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M600 282 L600 418" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M428 445 L292 445" class="line" marker-end="url(#arrow)"/>
    <path d="M428 555 L292 555" class="line" marker-end="url(#arrow)"/>
    <path d="M772 495 L918 495" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <text x="150" y="195" text-anchor="middle" class="h">MCP client</text>
  <text x="150" y="228" text-anchor="middle" class="t">Claude Code or any IDE</text>

  <text x="600" y="168" text-anchor="middle" class="h">proxy (stdio)</text>
  <text x="600" y="200" text-anchor="middle" class="t">hides tools that are not approved</text>
  <text x="600" y="228" text-anchor="middle" class="t">refuses tools/call for them</text>
  <text x="600" y="256" text-anchor="middle" class="t">re-checks on list_changed</text>

  <text x="1050" y="195" text-anchor="middle" class="h">upstream MCP server</text>
  <text x="1050" y="228" text-anchor="middle" class="t">spawned by the proxy</text>

  <text x="600" y="458" text-anchor="middle" class="h">guard :8741</text>
  <text x="600" y="490" text-anchor="middle" class="t">SHA-256 pin per tool definition</text>
  <text x="600" y="518" text-anchor="middle" class="t">poisoning scanner</text>
  <text x="600" y="546" text-anchor="middle" class="t">allow, pending or blocked</text>

  <text x="160" y="440" text-anchor="middle" class="h">tools.lock.json</text>
  <text x="160" y="468" text-anchor="middle" class="t">pins and rug pull alerts</text>
  <text x="160" y="550" text-anchor="middle" class="h">events.jsonl</text>
  <text x="160" y="578" text-anchor="middle" class="t">hash chained audit log</text>

  <text x="1045" y="458" text-anchor="middle" class="h">review UI</text>
  <text x="1045" y="490" text-anchor="middle" class="t">vanilla JS</text>
  <text x="1045" y="518" text-anchor="middle" class="t">approve the exact hash</text>
  <text x="1045" y="546" text-anchor="middle" class="t">alerts, scanner, events</text>

  <text x="360" y="192" text-anchor="middle" class="l">JSON-RPC</text>
  <text x="840" y="192" text-anchor="middle" class="l">pipes</text>
  <text x="614" y="345" class="l">POST /api/check</text>
  <text x="614" y="370" class="l">with proxy token</text>
  <text x="586" y="345" text-anchor="end" class="l">decision</text>
  <text x="586" y="370" text-anchor="end" class="l">per tool</text>
  <text x="360" y="432" text-anchor="middle" class="l">pins</text>
  <text x="360" y="542" text-anchor="middle" class="l">append</text>
  <text x="845" y="482" text-anchor="middle" class="l">admin token</text>

  <text x="60" y="700" class="step">1. client calls tools/list, the proxy sends every definition to the guard</text>
  <text x="620" y="700" class="step">2. guard hashes and scans, new tools wait for review</text>
  <text x="60" y="745" class="step">3. only tools whose hash matches the approved pin reach the model</text>
  <text x="620" y="745" class="step">4. a changed hash is a rug pull: blocked, alert raised</text>
</svg>
</body>
</html>
