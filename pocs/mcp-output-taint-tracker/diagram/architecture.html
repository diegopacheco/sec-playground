<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCP Output Taint Tracker architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fdfcf8; }
  svg { display: block; font-family: "Caveat", "Comic Sans MS", cursive; }
  .title { font-size: 40px; font-weight: 700; fill: #1d1d1f; }
  .h { font-size: 27px; font-weight: 700; fill: #1d1d1f; }
  .t { font-size: 20px; fill: #3a3a3f; }
  .l { font-size: 20px; fill: #5b21b6; }
  .step { font-size: 22px; fill: #1d1d1f; }
  .shape { stroke: #1d1d1f; stroke-width: 2.2; }
  .line { stroke: #1d1d1f; stroke-width: 2.2; fill: none; }
  .red { stroke: #b91c1c; }
</style>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1d1d1f" stroke-width="2"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#b91c1c" stroke-width="2"/>
    </marker>
  </defs>

  <text x="600" y="58" text-anchor="middle" class="title">MCP Output Taint Tracker: tool output is followed into tool arguments</text>

  <g filter="url(#wobble)">
    <rect x="30" y="150" width="250" height="110" rx="14" fill="#dbeafe" class="shape"/>
    <rect x="400" y="150" width="250" height="110" rx="14" fill="#fce7f3" class="shape"/>
    <rect x="760" y="100" width="410" height="460" rx="18" fill="#f5f3ff" class="shape" stroke-dasharray="8 6"/>
    <rect x="790" y="160" width="350" height="100" rx="12" fill="#ede9fe" class="shape"/>
    <rect x="790" y="300" width="350" height="120" rx="12" fill="#dcfce7" class="shape"/>
    <rect x="790" y="455" width="350" height="80" rx="12" fill="#e0f2fe" class="shape"/>
    <rect x="400" y="330" width="250" height="150" rx="14" fill="#fef9c3" class="shape"/>
    <rect x="30" y="450" width="250" height="90" rx="14" fill="#dbeafe" class="shape"/>
  </g>

  <text x="155" y="192" text-anchor="middle" class="h">Claude Code agent</text>
  <text x="155" y="222" text-anchor="middle" class="t">reads pages, files, mail</text>
  <text x="155" y="246" text-anchor="middle" class="t">then calls tools</text>

  <text x="525" y="192" text-anchor="middle" class="h">bin/hook</text>
  <text x="525" y="222" text-anchor="middle" class="t">hook json to REST</text>
  <text x="525" y="246" text-anchor="middle" class="t">exit 2 = deny, fail closed</text>

  <text x="965" y="134" text-anchor="middle" class="h">tracker server (Go)</text>

  <text x="965" y="195" text-anchor="middle" class="h">policy</text>
  <text x="965" y="222" text-anchor="middle" class="t">sources get untrusted / secret</text>
  <text x="965" y="246" text-anchor="middle" class="t">sinks name the forbidden labels</text>

  <text x="965" y="333" text-anchor="middle" class="h">checker</text>
  <text x="965" y="360" text-anchor="middle" class="t">decode plain, url, base64, hex</text>
  <text x="965" y="384" text-anchor="middle" class="t">match entities and 4-gram shingles</text>
  <text x="965" y="408" text-anchor="middle" class="t">skip what the user typed</text>

  <text x="965" y="490" text-anchor="middle" class="h">REST /api</text>
  <text x="965" y="518" text-anchor="middle" class="t">sessions, events, decisions</text>

  <text x="525" y="368" text-anchor="middle" class="h">taint index</text>
  <text x="525" y="396" text-anchor="middle" class="t">url host email token secret</text>
  <text x="525" y="420" text-anchor="middle" class="t">word shingles per source</text>
  <text x="525" y="444" text-anchor="middle" class="t">trusted prompt text</text>
  <text x="525" y="468" text-anchor="middle" class="t">one per session</text>

  <text x="155" y="488" text-anchor="middle" class="h">React UI</text>
  <text x="155" y="516" text-anchor="middle" class="t">timeline, flow graph</text>

  <path d="M282 205 L396 205" class="line" marker-end="url(#arrow)"/>
  <text x="339" y="140" text-anchor="middle" class="l">prompt</text>
  <text x="339" y="162" text-anchor="middle" class="l">result</text>
  <text x="339" y="184" text-anchor="middle" class="l">call</text>

  <path d="M652 190 L786 190" class="line" marker-end="url(#arrow)"/>
  <text x="719" y="180" text-anchor="middle" class="l">POST</text>

  <path d="M786 236 L654 236" class="line red" marker-end="url(#arrow-red)"/>
  <text x="719" y="226" text-anchor="middle" class="l" fill="#b91c1c">deny</text>

  <path d="M965 262 L965 296" class="line" marker-end="url(#arrow)"/>
  <text x="988" y="286" class="l">sink args</text>

  <path d="M800 262 C740 290 690 300 640 328" class="line" marker-end="url(#arrow)"/>
  <text x="690" y="300" text-anchor="end" class="l">index result</text>

  <path d="M788 372 L654 372" class="line" marker-end="url(#arrow)"/>
  <text x="719" y="362" text-anchor="middle" class="l">lookup</text>

  <path d="M282 495 L786 495" class="line" marker-end="url(#arrow)"/>
  <text x="530" y="522" text-anchor="middle" class="l">polls /api through vite proxy</text>

  <text x="40" y="610" class="step">1. UserPromptSubmit stores the prompt as trusted text, so values the user typed are endorsed.</text>
  <text x="40" y="642" class="step">2. PostToolUse labels the result by policy, extracts entities and shingles, and adds them to the session index.</text>
  <text x="40" y="674" class="step">3. PreToolUse sends the call. Only sink arguments are checked, after every decoding is tried.</text>
  <text x="40" y="706" class="step">4. A forbidden label found in a sink argument becomes a flow that points back to the source event.</text>
  <text x="40" y="738" class="step">5. Any flow means deny: the hook exits 2 and Claude Code shows the flows instead of running the tool.</text>
  <text x="40" y="770" class="step">6. Tracker down or bad answer: the hook also exits 2, nothing runs unchecked.</text>
</svg>
</body>
</html>
